name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Build, test, and exercise demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: settleguard
          POSTGRES_USER: settleguard
          POSTGRES_PASSWORD: settleguard_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settleguard -d settleguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://settleguard:settleguard_dev@127.0.0.1:5432/settleguard
      SETTLEGUARD_AGENT_PROVIDER: gemini
      API_BASE_URL: http://127.0.0.1:4000

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Create database schema
        working-directory: apps/api
        run: npm run db:push

      - name: Seed integration-test fixtures
        working-directory: apps/api
        run: |
          npm run ingest -- ../../datasets/agent-slice agent-slice-001
          npm run reconcile -- 1
          npm run benchmark -- --dataset demo

      - name: Build and test API
        working-directory: apps/api
        run: npm run build && npm test

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck and build web
        working-directory: apps/web
        run: npm run typecheck && npm run build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Exercise the browser demo
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
