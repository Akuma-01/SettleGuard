services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: settleguard
      POSTGRES_USER: settleguard
      POSTGRES_PASSWORD: settleguard_dev
    volumes:
      - settleguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settleguard -d settleguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://settleguard:settleguard_dev@postgres:5432/settleguard
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SETTLEGUARD_AGENT_MODEL: ${SETTLEGUARD_AGENT_MODEL:-claude-sonnet-5}
      PORT: 4000
    command: ["sh", "-c", "npm run db:push && npm start"]
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - settleguard-artifacts:/workspace/apps/api/artifacts

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:4000
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  settleguard-postgres:
  settleguard-artifacts:
